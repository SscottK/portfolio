services:
  - type: web
    name: portfolio-backend
    runtime: python
    plan: starter
    rootDir: backend
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    startCommand: bash scripts/start.sh
    disk:
      name: portfolio-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: "3.12"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_ALLOWED_HOSTS
        value: ".onrender.com"
      - key: DATABASE_URL
        fromDatabase:
          name: portfolio-db
          property: connectionString
      - key: MEDIA_ROOT
        value: /var/data/media
      - key: CORS_ALLOWED_ORIGINS
        sync: false

databases:
  - name: portfolio-db
    plan: free
    databaseName: portfolio
    user: portfolio
